services:
    
    bot:
        build:
          context: .
          dockerfile: build/Dockerfile
        entrypoint: bash entrypoint.sh
        volumes:
            - ./src/:/usr/src/app/
        ports:
            - "8000:8000"
        env_file:
            - .env

    mongo:
        image: mongo
        restart: always
        env_file:
            - .env
        ports:
          - "27017:27017"
        volumes:
            - ./data:/data/db